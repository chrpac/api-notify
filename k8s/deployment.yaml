apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-notify-deploy
  namespace: default
spec:
  replicas: 3
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: api-notify
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app: api-notify
    spec:
      containers:
        - name: api-notify
          image: gcr.io/jawis-core/api-notify:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3333
              protocol: TCP
          env:
            - name: PORT
              value: "3333"
            - name: NODE_ENV
              value: production
            - name: TZ
              value: Asia/Bangkok
            - name: NODE_OPTIONS
              value: --max_old_space_size=2048
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 800m
              memory: 2560Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3333
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
